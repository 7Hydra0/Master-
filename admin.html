<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel | Conselho Master</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-wrap">
<header class="admin-head"><div><b style="letter-spacing:.15em">CONSELHO MASTER</b><div style="font-size:11px;color:#bac5d0;margin-top:5px">Painel administrativo</div></div><div><button id="logout" type="button" hidden>Sair</button><a href="index.html" style="font-size:12px;color:#e4c98e">← Portal público</a></div></header>
<main class="admin-body">
<section id="login" class="panel login" hidden><h2>Entrar</h2><form id="login-form"><label>E-mail<input name="email" type="email" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button>Entrar</button><p id="login-msg" class="msg" role="alert"></p></form></section>
<div id="app" hidden>
<div class="stats"><div class="stat"><small>Total de solicitações</small><b id="s-total">0</b></div><div class="stat"><small>Novas</small><b id="s-new">0</b></div><div class="stat"><small>Concluídas</small><b id="s-done">0</b></div></div>
<div class="admin-grid"><section class="panel"><h2>Registrar solicitação</h2><form id="request-form"><label>Nome ou referência<input name="name" required maxlength="100"></label><label>Tipo<select name="type"><option>Informações institucionais</option><option>Organização administrativa</option><option>Documentação institucional</option><option>Consultoria organizacional</option><option>Outro assunto</option></select></label><label>Observação<textarea name="note" rows="3" maxlength="1500"></textarea></label><button>Salvar solicitação</button></form></section>
<section class="panel"><h2>Solicitações recentes</h2><div id="requests"></div></section></div>
<div class="admin-grid"><section class="panel"><h2>Publicar comunicado</h2><form id="notice-form"><label>Título<input name="titulo" required maxlength="120"></label><label>Texto<textarea name="corpo" rows="4" required maxlength="2000"></textarea></label><button>Publicar no site</button></form></section><section class="panel"><h2>Comunicados</h2><div id="notices-admin"></div></section></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="db.js"></script><script src="admin.js"></script></body></html>
