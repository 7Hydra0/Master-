<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel | Conselho Master</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.admin-wrap{min-height:100vh;background:#f2f4f7}.admin-head{background:#0b1c31;color:#fff;padding:25px clamp(20px,6vw,80px);display:flex;justify-content:space-between;align-items:center}.admin-body{padding:35px clamp(18px,6vw,80px)}.demo{padding:13px 16px;background:#fff3d9;border:1px solid #e6c982;color:#76551d;font-size:12px;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat,.panel{background:white;border:1px solid #e3e7ec;padding:22px}.stat small{color:#788391}.stat b{display:block;font:30px 'Playfair Display',serif;margin-top:8px}.admin-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:18px}.panel h2{font:22px 'Playfair Display',serif;margin-top:0}.panel label{display:grid;gap:6px;font-size:12px;margin:10px 0}.panel input,.panel select,.panel textarea{padding:11px;border:1px solid #d9dfe6;font:13px 'DM Sans',sans-serif}.panel button{background:#0b1c31;color:white;border:0;padding:11px 15px;cursor:pointer}.item{border-top:1px solid #e5e9ee;padding:12px 0;font-size:13px}.item small{display:block;color:#788391;margin-top:4px}@media(max-width:760px){.stats,.admin-grid{grid-template-columns:1fr}.admin-head{gap:10px;flex-wrap:wrap}}
.login{max-width:420px}.msg{font-size:12px;color:#7b3030}.item .row{display:flex;gap:8px;margin-top:10px}.item a{color:#9a773e}.panel button.danger{background:#7b3030}.admin-head button{background:none;border:1px solid #e4c98e;color:#e4c98e;padding:7px 12px;margin-right:14px;font-size:12px;cursor:pointer}</style></head>
<body class="admin-wrap">
<header class="admin-head"><div><b style="letter-spacing:.15em">CONSELHO MASTER</b><div style="font-size:11px;color:#bac5d0;margin-top:5px">Painel administrativo</div></div><div><button id="logout" type="button" hidden>Sair</button><a href="index.html" style="font-size:12px;color:#e4c98e">← Portal público</a></div></header>
<main class="admin-body">
<section id="login" class="panel login" hidden><h2>Entrar</h2><form id="login-form"><label>E-mail<input name="email" type="email" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button>Entrar</button><p id="login-msg" class="msg" role="alert"></p></form></section>
<div id="app" hidden>
<div class="stats"><div class="stat"><small>Total de solicitações</small><b id="s-total">0</b></div><div class="stat"><small>Novas</small><b id="s-new">0</b></div><div class="stat"><small>Concluídas</small><b id="s-done">0</b></div></div>
<div class="admin-grid"><section class="panel"><h2>Registrar solicitação</h2><form id="request-form"><label>Nome ou referência<input name="name" required maxlength="100"></label><label>Tipo<select name="type"><option>Informações institucionais</option><option>Organização administrativa</option><option>Documentação institucional</option><option>Consultoria organizacional</option><option>Outro assunto</option></select></label><label>Observação<textarea name="note" rows="3" maxlength="1500"></textarea></label><button>Salvar solicitação</button></form></section>
<section class="panel"><h2>Solicitações recentes</h2><div id="requests"></div></section></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="db.js"></script><script src="admin.js"></script></body></html>
